[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "the-void-gamecheck"
dynamic = ["version"]
description = "THE VOID GAMECHECK: how well does a game run on Linux? Steam, ProtonDB, Steam Deck and Lutris in one verdict."
readme = "README.md"
license = "MIT"
authors = [{ name = "THE VOID PROTOCOL", email = "thevoidofficialprivacy@gmail.com" }]
requires-python = ">=3.12"
dependencies = ["httpx>=0.27,<1"]

[project.optional-dependencies]
gui = ["PySide6>=6.8"]
dev = ["pytest>=8", "ruff>=0.8"]

[project.scripts]
gamecheck = "void_gamecheck.cli:main"

[project.gui-scripts]
the-void-gamecheck = "void_gamecheck.app:main"

[tool.hatch.version]
path = "void_gamecheck/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["void_gamecheck"]

[tool.hatch.build.targets.sdist]
exclude = [".venv", "build", "dist"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
